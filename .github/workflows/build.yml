name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: 'Kernel source tag/branch from Motorola'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev libelf-dev python3 clang lld llvm

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.kernel_tag }} https://github.com/MotorolaMobilityLLC/kernel-mtk kernel

      - name: Patch MAC change
        run: |
          python3 -c "
          f = open('kernel/net/core/dev.c', 'r')
          c = f.read()
          f.close()
          old = '\tif (!ops->ndo_set_mac_address)\n\t\treturn -EOPNOTSUPP;'
          new = '\tif (!ops->ndo_set_mac_address) {\n\t\tmemcpy(dev->dev_addr, sa->sa_data, dev->addr_len);\n\t\treturn 0;\n\t}'
          c2 = c.replace(old, new, 1)
          if c == c2:
              print('PATCH FAILED')
              exit(1)
          open('kernel/net/core/dev.c', 'w').write(c2)
          print('PATCH OK')
          "

      - name: Configure kernel
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 gki_defconfig

      - name: Build kernel
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 -j$(nproc) Image.gz

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel_patched
          path: kernel/arch/arm64/boot/Image.gz