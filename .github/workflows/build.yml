name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: 'Kernel source tag/branch from Motorola'
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev \
            libelf-dev python3 clang lld llvm

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            -b ${{ github.event.inputs.kernel_tag }} \
            https://github.com/MotorolaMobilityLLC/kernel-mtk kernel

      - name: Patch MAC change
        run: |
          python3 -c "
          path = 'kernel/net/core/dev.c'
          c = open(path).read()
          old = '\tif (!ops->ndo_set_mac_address)\n\t\treturn -EOPNOTSUPP;'
          new = (
            '\tif (!ops->ndo_set_mac_address) {\n'
            '\t\tmemcpy((unsigned char *)dev->dev_addr, sa->sa_data, dev->addr_len);\n'
            '\t\treturn 0;\n'
            '\t}'
          )
          if old not in c:
              print('ERROR: patch target not found — check kernel version')
              exit(1)
          open(path, 'w').write(c.replace(old, new, 1))
          print('PATCH OK')
          "

      - name: Configure kernel
        run: |
          cp moto_g06.config kernel/arch/arm64/configs/moto_g06_defconfig
          cd kernel
          # Desactivar TRIM_UNUSED_KSYMS para evitar dependencia de abi_symbollist.raw
          scripts/config --file arch/arm64/configs/moto_g06_defconfig \
            --disable TRIM_UNUSED_KSYMS
          make ARCH=arm64 LLVM=1 moto_g06_defconfig

      - name: Build kernel
        run: |
          df -h .
          cd kernel
          make ARCH=arm64 LLVM=1 \
            -j$(nproc) Image.gz \
            2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_logs
          path: /tmp/build.log

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel_patched_${{ github.event.inputs.kernel_tag }}
          path: kernel/arch/arm64/boot/Image*